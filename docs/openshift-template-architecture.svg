<svg viewBox="0 0 900 1400" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <linearGradient id="ocpGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdeeee"/>
      <stop offset="100%" stop-color="#fff5f5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="1400" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" font-size="26" font-weight="700" fill="#1a202c">OpenShift Template-Based Deployment Architecture</text>
  <text x="450" y="72" text-anchor="middle" font-size="14" fill="#718096">Source-to-Image (S2I) flow triggered from an OpenShift Template</text>

  <!-- GitHub node -->
  <g>
    <rect x="330" y="100" width="240" height="70" rx="10" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
    <text x="450" y="130" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">GitHub Repository</text>
    <text x="450" y="150" text-anchor="middle" font-size="12" fill="#555555">Application source code</text>
  </g>
  <line x1="450" y1="170" x2="450" y2="205" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- OpenShift cluster boundary -->
  <rect x="60" y="210" width="780" height="980" rx="16" fill="url(#ocpGrad)" stroke="#e53e3e" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="90" y="240" font-size="14" font-weight="700" fill="#c53030">OpenShift Cluster</text>

  <!-- Template box -->
  <rect x="95" y="255" width="710" height="895" rx="12" fill="#ffffff" stroke="#c53030" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="450" y="282" text-anchor="middle" font-size="13" font-weight="700" fill="#c53030">Instantiated from OpenShift Template (oc new-app -f template.yaml)</text>

  <!-- BuildConfig -->
  <g>
    <rect x="330" y="310" width="240" height="70" rx="10" fill="#ebf8ff" stroke="#3182ce" stroke-width="2"/>
    <text x="450" y="340" text-anchor="middle" font-size="17" font-weight="600" fill="#1a365d">BuildConfig</text>
    <text x="450" y="360" text-anchor="middle" font-size="12" fill="#2c5282">Watches Git source, triggers builds</text>
  </g>
  <line x1="450" y1="380" x2="450" y2="415" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- S2I Build -->
  <g>
    <rect x="330" y="420" width="240" height="70" rx="10" fill="#faf5ff" stroke="#805ad5" stroke-width="2"/>
    <text x="450" y="450" text-anchor="middle" font-size="17" font-weight="600" fill="#44337a">S2I Build</text>
    <text x="450" y="470" text-anchor="middle" font-size="12" fill="#553c9a">Builds container image from source</text>
  </g>
  <line x1="450" y1="490" x2="450" y2="525" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ImageStream -->
  <g>
    <rect x="330" y="530" width="240" height="70" rx="10" fill="#fffaf0" stroke="#dd6b20" stroke-width="2"/>
    <text x="450" y="560" text-anchor="middle" font-size="17" font-weight="600" fill="#7b341e">ImageStream</text>
    <text x="450" y="580" text-anchor="middle" font-size="12" fill="#9c4221">Tracks and versions built images</text>
  </g>
  <line x1="450" y1="600" x2="450" y2="635" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- DeploymentConfig -->
  <g>
    <rect x="330" y="640" width="240" height="70" rx="10" fill="#f0fff4" stroke="#38a169" stroke-width="2"/>
    <text x="450" y="670" text-anchor="middle" font-size="17" font-weight="600" fill="#22543d">DeploymentConfig</text>
    <text x="450" y="690" text-anchor="middle" font-size="12" fill="#276749">Rolls out new image versions</text>
  </g>
  <line x1="450" y1="710" x2="450" y2="745" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Pod -->
  <g>
    <rect x="330" y="750" width="240" height="70" rx="10" fill="#ebf8ff" stroke="#3182ce" stroke-width="2"/>
    <text x="450" y="780" text-anchor="middle" font-size="17" font-weight="600" fill="#1a365d">Pod</text>
    <text x="450" y="800" text-anchor="middle" font-size="12" fill="#2c5282">Running application container(s)</text>
  </g>
  <line x1="450" y1="820" x2="450" y2="855" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Service -->
  <g>
    <rect x="330" y="860" width="240" height="70" rx="10" fill="#faf5ff" stroke="#805ad5" stroke-width="2"/>
    <text x="450" y="890" text-anchor="middle" font-size="17" font-weight="600" fill="#44337a">Service</text>
    <text x="450" y="910" text-anchor="middle" font-size="12" fill="#553c9a">Stable internal networking / load balancing</text>
  </g>
  <line x1="450" y1="930" x2="450" y2="965" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Route -->
  <g>
    <rect x="330" y="970" width="240" height="70" rx="10" fill="#fffaf0" stroke="#dd6b20" stroke-width="2"/>
    <text x="450" y="1000" text-anchor="middle" font-size="17" font-weight="600" fill="#7b341e">Route</text>
    <text x="450" y="1020" text-anchor="middle" font-size="12" fill="#9c4221">Exposes Service externally (HTTP/HTTPS)</text>
  </g>
  <line x1="450" y1="1040" x2="450" y2="1075" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- User -->
  <g>
    <rect x="330" y="1080" width="240" height="70" rx="10" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
    <text x="450" y="1110" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">End User</text>
    <text x="450" y="1130" text-anchor="middle" font-size="12" fill="#555555">Accesses app via public URL</text>
  </g>

  <!-- Legend -->
  <g transform="translate(120,1160)">
    <rect x="0" y="0" width="660" height="70" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1"/>
    <text x="15" y="22" font-size="12" font-weight="700" fill="#2d3748">Flow:</text>
    <text x="15" y="42" font-size="12" fill="#4a5568">1. Developer pushes code to GitHub  →  2. BuildConfig triggers S2I Build  →  3. Image pushed to ImageStream</text>
    <text x="15" y="60" font-size="12" fill="#4a5568">4. DeploymentConfig deploys new Pod  →  5. Service load-balances traffic  →  6. Route exposes it to the User</text>
  </g>
</svg>
